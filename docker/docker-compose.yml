services:
  # CPU build of vLLM (runs on Apple Silicon; no GPU). Serves an
  # OpenAI-compatible API on :8000, used by agents/model.py ("vllm" backend).
  vllm:
    image: vllm/vllm-openai-cpu:latest-arm64
    container_name: vllm
    ports:
      - "8000:8000"
    environment:
      VLLM_CPU_KVCACHE_SPACE: 4
    volumes:
      - ~/.cache/huggingface:/root/.cache/huggingface
    shm_size: 4g
    security_opt:
      - seccomp:unconfined
    cap_add:
      - SYS_NICE
    command: ["Qwen/Qwen2.5-Coder-0.5B-Instruct", "--max-model-len", "8192", "--enforce-eager"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      start_period: 300s
      timeout: 10s
      retries: 3

  neo4j:
    image: neo4j:latest
    container_name: neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/test
      - NEO4J_dbms_security_auth__minimum__password__length=3

  # Milvus standalone with embedded etcd and local-disk storage (no MinIO:
  # MinIO no longer publishes community Docker images).
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: milvus-standalone
    security_opt:
      - seccomp:unconfined
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus-data:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    command: ["milvus", "run", "standalone"]

volumes:
  milvus-data:
